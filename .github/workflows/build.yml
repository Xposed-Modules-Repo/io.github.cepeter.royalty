name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Download Android NDK
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r26d-linux.zip -O /tmp/ndk.zip
          unzip -q /tmp/ndk.zip -d /tmp
          echo "ANDROID_NDK_HOME=/tmp/android-ndk-r26d" >> $GITHUB_ENV
          echo "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: Build Zygisk library (arm64-v8a)
        run: |
          CC="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang"
          mkdir -p zygisk/lib/arm64-v8a
          $CC --target=aarch64-linux-android26 \
            -shared -fPIC -O2 -Wall -Wextra -D_GNU_SOURCE \
            -I zygisk/src \
            -o zygisk/lib/arm64-v8a/libtelegram_hider.so \
            zygisk/src/telegram_hider.c zygisk/src/art_hook.c zygisk/src/cJSON.c

      - name: Build Zygisk library (armeabi-v7a)
        run: |
          CC="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi26-clang"
          mkdir -p zygisk/lib/armeabi-v7a
          $CC --target=armv7a-linux-androideabi26 \
            -shared -fPIC -O2 -Wall -Wextra -D_GNU_SOURCE -marm \
            -I zygisk/src \
            -o zygisk/lib/armeabi-v7a/libtelegram_hider.so \
            zygisk/src/telegram_hider.c zygisk/src/art_hook.c zygisk/src/cJSON.c

      - name: Assemble module
        run: |
          mkdir -p module/zygisk/arm64-v8a module/zygisk/armeabi-v7a
          cp zygisk/lib/arm64-v8a/libtelegram_hider.so module/zygisk/arm64-v8a/
          cp zygisk/lib/armeabi-v7a/libtelegram_hider.so module/zygisk/armeabi-v7a/
          chmod 0755 module/zygisk/arm64-v8a/libtelegram_hider.so
          chmod 0755 module/zygisk/armeabi-v7a/libtelegram_hider.so

      - name: Package ZIP (files at root, not under module/)
        run: |
          VERSION=$(grep '^versionCode=' module/module.prop | cut -d= -f2)
          NAME=$(grep '^id=' module/module.prop | cut -d= -f2)
          rm -f "/tmp/${NAME}-v${VERSION}.zip"
          (cd module/ && zip -r "/tmp/${NAME}-v${VERSION}.zip" .)
          ls -la /tmp/${NAME}-v${VERSION}.zip

      - name: Delete previous releases (keep latest only)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Removing all previous GitHub releases for this repo…"
          gh release list --limit 100 --json tagName \
            | jq -r '.[].tagName' \
            | while read -r tag; do
                echo "  Deleting release for tag: $tag"
                gh release delete "$tag" --yes
              done
          echo "Previous releases cleaned."

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: /tmp/telegram_chat_hider-v*.zip
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
